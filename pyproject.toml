[project]
name = "diffusion-transformer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.11.*"  # Pins to your current Vast.ai version
dependencies = [
    "datasets>=3.2.0",
    "einops>=0.8.0",
    "timm>=1.0.0",
    "torch==2.3.1",
    "torchvision==0.18.1",
    "torchaudio==2.3.1",
    "transformers>=4.48.0",
]

[tool.uv]
# Tells uv to look at PyPI and PyTorch, but prioritizes PyPI for non-torch items
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dit*"]